{% extends 'base.html' %}

{% block title %}Já Separada{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-warning">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill fs-1 mb-3 text-warning"></i>
        <h5 class="fw-bold mb-1">{{ peca.produto.nome }}</h5>
        <div class="alert alert-warning mt-3">
          Esta peça já foi separada por {{ peca.separada_por.get_full_name|default:peca.separada_por.username }}
          em {{ peca.separada_em|date:"d/m/Y H:i" }}.
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
