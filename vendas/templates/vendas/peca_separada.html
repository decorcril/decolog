{% extends 'base.html' %}

{% block title %}Peça Separada{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-success">
      <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle-fill fs-1 mb-3 text-success"></i>
        <h5 class="fw-bold mb-1">Peça Separada!</h5>
        <p class="text-muted mb-1">{{ peca.produto.nome }}</p>
        {% if pedido %}
        <p class="text-muted small">Pedido <strong>{{ pedido.numero }}</strong> — {{ pedido.cliente.nome }}</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
