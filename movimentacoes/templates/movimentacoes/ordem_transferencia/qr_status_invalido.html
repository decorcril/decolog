{% extends 'base.html' %}

{% block title %}Ordem Inválida — {{ ordem.numero }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-warning">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill fs-1 mb-3 text-warning"></i>
        <h5 class="fw-bold mb-1">Ordem {{ ordem.numero }}</h5>
        <p class="text-muted mb-3">{{ ordem.local_origem.nome }} → {{ ordem.local_destino.nome }}</p>
        <div class="alert alert-warning">
          Esta ordem está <strong>{{ ordem.get_status_display }}</strong> e não pode ser confirmada.
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
